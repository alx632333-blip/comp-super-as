<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammar Quest: Comparatives, Superlatives, as…as</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@500;700;800&display=swap">
<style>
:root{--bg:#0b0920;--ink:#f3f1ff;--mute:#a9a5d6;--glass:#ffffff12;--bd:#ffffff26;--good:#2fe3a0;--bad:#ff5470;--gold:#ffd166;--c:#7c5cff;--c2:#ff6bd6;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#f1efff;--ink:#17133d;--mute:#5a5590;--glass:#ffffffc0;--bd:#17133d26;color-scheme:light}}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:500 18px/1.5 Manrope,system-ui,sans-serif;overflow-x:hidden}
.blob{position:fixed;width:50vmax;height:50vmax;border-radius:50%;filter:blur(90px);opacity:.4;z-index:-1;animation:drift 20s ease-in-out infinite alternate}
.b1{background:#7c5cff;top:-18vmax;left:-14vmax}.b2{background:#ff6bd6;bottom:-20vmax;right:-14vmax;animation-delay:-8s}.b3{background:#2fe3a0;width:30vmax;height:30vmax;top:40%;left:55%;opacity:.22;animation-delay:-14s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 56px}
h1,h2,.u{font-family:Unbounded,Manrope,sans-serif;font-weight:700;margin:0}
h1{font-size:clamp(26px,7vw,40px);line-height:1.1;background:linear-gradient(90deg,#fff,var(--gold) 45%,#ff8fd8);-webkit-background-clip:text;background-clip:text;color:transparent;margin:10px 0 8px}
h2{font-size:clamp(17px,4.4vw,22px);margin-bottom:14px}
.sub{color:var(--mute);margin:0 0 22px}
.glass{background:var(--glass);border:1px solid var(--bd);border-radius:24px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 40px #0003}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px 8px 16px;border-radius:999px;margin-bottom:22px}
.xp{font:700 14px Unbounded,sans-serif}.xp span{color:var(--gold)}
.hearts{display:flex;gap:4px;font-size:24px;min-height:34px;align-items:center}
.h{color:#ff4d79;transition:color .3s;display:inline-block}.h.off{color:#8884}.h.brk{animation:brk .6s}
@keyframes brk{20%{transform:scale(1.5)}60%{transform:scale(.7) rotate(-20deg)}}
.mute{background:var(--glass);border:1px solid var(--bd);border-radius:50%;width:38px;height:38px;font-size:17px;cursor:pointer;color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.btn{font:700 14px Unbounded,sans-serif;color:#fff;border:0;border-radius:16px;padding:15px 24px;background:linear-gradient(135deg,#7c5cff,#ff6bd6);box-shadow:0 8px 24px #7c5cff66;transition:transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 30px #7c5cff88}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--glass);border:1px solid var(--bd);box-shadow:none;color:var(--ink)}
:is(.btn,.opt,.stage,input,.mute):focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.scr{animation:in .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}}
.map{display:grid;gap:14px}
.stage{position:relative;display:flex;gap:16px;align-items:center;text-align:left;padding:18px;border-radius:22px;border:1px solid var(--bd);background:var(--glass);backdrop-filter:blur(16px);overflow:hidden;transition:transform .2s,border-color .2s;animation:in .5s both;animation-delay:calc(var(--i)*90ms)}
.stage::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,var(--c),var(--c2));opacity:.14;transition:opacity .25s}
.stage:hover:not(:disabled){transform:translateY(-4px) scale(1.01);border-color:var(--c)}.stage:hover:not(:disabled)::before{opacity:.3}
.stage:disabled{opacity:.5;cursor:not-allowed}
.stage.boss{border-color:var(--c2);animation:in .5s both,glow 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*90ms),1s}
@keyframes glow{50%{box-shadow:0 0 34px #ff6bd66b}}
.ico{position:relative;flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,var(--c),var(--c2))}
.stage b{position:relative;display:block;font:700 15px Unbounded,sans-serif;margin-bottom:2px}
.stage small{position:relative;color:var(--mute);font-size:15px}
.stars{position:relative;margin-left:auto;color:var(--gold);font-size:20px;white-space:nowrap}
.card{padding:22px;margin-bottom:18px;position:relative}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.rules li{padding:12px 14px;border-radius:14px;background:var(--glass);border-left:4px solid var(--c)}
.rules em{font-style:normal;font-weight:800;color:var(--gold)}
.ex{display:block;color:var(--mute);font-size:16px;margin-top:3px}
.bar{height:10px;border-radius:99px;background:var(--glass);border:1px solid var(--bd);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;border-radius:99px;width:0;background:linear-gradient(90deg,var(--c),var(--c2));transition:width .6s cubic-bezier(.2,.8,.2,1);position:relative}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff6,transparent);animation:shine 1.8s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--mute);font-size:14px;margin-bottom:10px}
.combo{color:var(--gold);font-weight:800;animation:pop .4s}
@keyframes pop{50%{transform:scale(1.25)}}
.q{font:700 clamp(20px,5vw,26px)/1.4 Manrope,sans-serif;margin:0 0 10px}
.blank{display:inline-block;min-width:90px;text-align:center;border-bottom:3px solid var(--gold);color:var(--gold);animation:blink 1.4s infinite}
.blank.done{animation:none;color:var(--good);border-color:var(--good)}
@keyframes blink{50%{border-color:transparent}}
.chip{display:inline-block;padding:2px 14px;border-radius:99px;background:linear-gradient(135deg,var(--c),var(--c2));color:#140f35;font-weight:800;font-size:15px;margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{padding:14px 18px;text-align:left;font-weight:700;font-size:19px;border-radius:16px;background:var(--glass);border:1px solid var(--bd);transition:transform .15s,background .15s,border-color .15s;animation:in .4s both;animation-delay:calc(var(--i)*70ms)}
.opt:hover:not(:disabled){transform:translateX(6px);border-color:var(--c);background:#ffffff1f}
.opt:disabled{cursor:default}
.opt.ok{background:var(--good);color:#052a1d;border-color:var(--good);box-shadow:0 0 0 5px #2fe3a04d;animation:pop .4s}
.opt.no{background:var(--bad);color:#2b0009;border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.typed{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:150px;font:700 20px Manrope,sans-serif;color:var(--ink);background:var(--glass);border:1px solid var(--bd);border-radius:16px;padding:13px 16px}
input.ok{border-color:var(--good);box-shadow:0 0 0 5px #2fe3a04d}input.no{border-color:var(--bad);animation:shake .4s}
.fb{margin-top:18px;padding:14px 16px;border-radius:16px;animation:in .35s both}
.fb.good{background:#2fe3a028;border:1px solid var(--good)}.fb.bad{background:#ff547028;border:1px solid var(--bad)}
.fb .u{display:block;font-size:13px;margin-bottom:4px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.center{text-align:center}.center .row{justify-content:center}
.fl{position:absolute;right:22px;top:14px;font:700 16px Unbounded,sans-serif;color:var(--gold);pointer-events:none;animation:rise 1.1s ease-out forwards}
@keyframes rise{to{transform:translateY(-46px);opacity:0}}
.cf{position:fixed;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:9;animation:cf 1s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.big{display:flex;justify-content:center;gap:6px;font-size:64px;color:var(--gold);margin:6px 0 14px;filter:drop-shadow(0 0 16px #ffd16680)}
.big span{animation:sp .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*.28s + .2s)}
.big .e{color:#8886}
@keyframes sp{from{transform:scale(0) rotate(-120deg);opacity:0}}
.skull{font-size:64px;animation:fall .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes fall{from{transform:translateY(-60px) rotate(-30deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap">
  <div class="hud glass"><span class="xp">XP <span id="xp">0</span></span><span class="hearts" id="hp"></span><button class="mute" id="snd" aria-label="Звук вкл/выкл">🔊</button></div>
  <div id="app"></div>
</div>
<script>
const COL={1:['#ff6b8b','#ff9f6b'],2:['#ffd166','#ff9f43'],3:['#2fe3a0','#35b8ff'],4:['#a78bff','#ff6bd6']};
// [text, base word, accepted answers, options or null, tip]
const LV=[
{id:1,icon:'⚔️',name:'Comparatives',ru:'Сравниваем двух: bigger than',
 rules:[
 ['Короткие слова: <em>+er</em> и <em>than</em>','tall → <em>taller</em> than · big → <em>bigger</em> than · easy → <em>easier</em> than'],
 ['Длинные слова (2+ слога): <em>more</em> + слово','interesting → <em>more interesting</em> than · careful → <em>more careful</em>'],
 ['Исключения — запомни!','good → <em>better</em> · bad → <em>worse</em> · far → <em>farther/further</em>']],
 qs:[
 ['My bag is ___ than yours.','heavy',['heavier'],['heavier','more heavy','heavyer'],'Слово на -y: y меняется на i и добавляем -er.'],
 ['This book is ___ than that one.','interesting',['more interesting'],['interestinger','more interesting','most interesting'],'Длинное слово → more + слово.'],
 ['Tom is ___ than Ben.','tall',['taller'],null,'Короткое слово: +er.'],
 ['Today is ___ than yesterday.','good',['better'],['gooder','more good','better'],'good — исключение: good → better.'],
 ['Cars are ___ than bikes.','expensive',['more expensive'],null,'Длинное слово: more expensive.'],
 ['My cold is ___ than yesterday.','bad',['worse'],['badder','worse','more bad'],'bad — исключение: bad → worse.'],
 ['The test was ___ than I expected.','easy',['easier'],['easier','more easy','easyer'],'-y → -ier: easy → easier.'],
 ['My sister is ___ than me.','young',['younger'],null,'Короткое слово: +er.'],
 ['Skiing is ___ than walking.','dangerous',['more dangerous'],['dangerouser','more dangerous','most dangerous'],'Длинное слово → more dangerous.'],
 ['The station is ___ than the park.','far',['farther','further'],null,'far → farther / further.']]},
{id:2,icon:'👑',name:'Superlatives',ru:'Самый-самый: the biggest',
 rules:[
 ['Короткие слова: <em>the + est</em>','high → <em>the highest</em> · big → <em>the biggest</em> · happy → <em>the happiest</em>'],
 ['Длинные слова: <em>the most</em> + слово','beautiful → <em>the most beautiful</em> · talkative → <em>the most talkative</em>'],
 ['Исключения','good → <em>the best</em> · bad → <em>the worst</em> · far → <em>the farthest</em>']],
 qs:[
 ['Everest is ___ mountain in the world.','high',['the highest'],['the higher','the highest','the most high'],'Самый → the + est. Не забывай the!'],
 ['She is ___ student in our class.','clever',['the cleverest','the most clever'],['the cleverest','the cleverer','cleverest'],'У superlative всегда есть the: the cleverest.'],
 ['This is ___ film I have ever seen.','bad',['the worst'],null,'bad → worse → the worst.'],
 ['It was ___ day of my life.','happy',['the happiest'],['the most happy','the happyest','the happiest'],'-y → -iest: happy → the happiest.'],
 ['Who is ___ person in your family?','talkative',['the most talkative'],null,'Длинное слово: the most talkative.'],
 ['Kyiv is one of ___ cities in Europe.','beautiful',['the most beautiful'],['the beautifulest','the most beautiful','most beautiful'],'the most + длинное слово.'],
 ['This is ___ question in the exam.','difficult',['the most difficult'],['the difficultest','the most difficult','the more difficult'],'Длинное слово: the most difficult.'],
 ['Jack is ___ boy in the team.','fast',['the fastest'],null,'Короткое слово: the fastest.'],
 ['Summer is ___ season for me.','good',['the best'],null,'good → better → the best.'],
 ['Which is ___ planet from the Sun?','far',['the farthest','the furthest'],null,'far → the farthest / the furthest.']]},
{id:3,icon:'⚖️',name:'as … as',ru:'Одинаково: as tall as',
 rules:[
 ['Равенство: <em>as + слово + as</em>','My brother is <em>as tall as</em> me. · She runs <em>as fast as</em> a cheetah.'],
 ['Отрицание: <em>not as … as</em> (меньше, чем)','This phone is <em>not as expensive as</em> that one.'],
 ['Между as … as слово остаётся в обычной форме','НЕ <em>as taller as</em>. Для глаголов — наречие: <em>as beautifully as</em>']],
 qs:[
 ['My brother is as ___ as me.','tall',['tall'],['tall','taller','tallest'],'Между as … as — обычная форма, без -er.'],
 ['He runs ___ fast as a cheetah.','',['as'],['than','as','so much'],'Равенство: as … as.'],
 ['Her hair is as ___ as snow.','white',['white'],null,'Обычная форма: white.'],
 ['Tea is ___ as good as coffee. (Tea is worse.)','',['not'],['not','no','never'],'Меньше, чем → not as … as.'],
 ['She sings as ___ as a professional.','beautiful',['beautifully'],null,'После глагола — наречие: beautifully.'],
 ['This exam was twice ___ difficult as the last one.','',['as'],['as','more','than'],'twice as … as — вдвое больше.'],
 ['I am not ___ old as my cousin.','',['as'],['as','than','more'],'not as … as: as + обычная форма.'],
 ['Is your flat as ___ as mine?','big',['big'],null,'Обычная форма: big.'],
 ['This soup is as ___ as that one.','hot',['hot'],['hotter','hot','hottest'],'as … as + обычная форма.'],
 ['She is as ___ as a bee.','busy',['busy'],null,'Форма не меняется: as busy as.']]},
{id:4,icon:'🐉',name:'BOSS: Mix',ru:'Всё вместе — финальный бой',
 rules:[
 ['Сравни: <em>-er / more … than</em>','Winter is <em>colder than</em> autumn.'],
 ['Самый: <em>the -est / the most</em>','the <em>best</em> · the <em>most</em> famous'],
 ['Одинаково: <em>as … as</em>','as <em>brave</em> as a lion']],
 qs:[
 ['Winter is ___ than autumn.','cold',['colder'],null,'Короткое слово: colder than.'],
 ['She is ___ than her sister.','careful',['more careful'],['carefuller','more careful','most careful'],'Длинное слово: more careful.'],
 ['He is as ___ as a lion.','brave',['brave'],['braver','brave','bravest'],'as … as — обычная форма.'],
 ['This is ___ pizza in town.','good',['the best'],['the goodest','the best','the better'],'good → better → the best.'],
 ['My room is ___ than yours.','big',['bigger'],null,'big → bigger (удваиваем g).'],
 ['My dad drives ___ than me.','fast',['faster'],null,'fast → faster (и прилагательное, и наречие).'],
 ['Maths is ___ subject at school.','hard',['the hardest'],null,'Самый → the hardest.'],
 ['Is this bag as ___ as that one?','cheap',['cheap'],['cheaper','cheap','cheapest'],'as … as + обычная форма.'],
 ['This puzzle is ___ than the last one.','difficult',['more difficult'],null,'Длинное слово: more difficult.'],
 ['It is ___ film of the year.','exciting',['the most exciting'],['the most exciting','the excitingest','the more exciting'],'the most + длинное слово.']]}
];
const S={xp:0,shown:0,stars:{},hp:3,li:0,qi:0,combo:0,got:0,sound:true};
const $=s=>document.querySelector(s),app=$('#app'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let ac;
function beep(f,d=.1,t='triangle',w=0){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+w;o.start(s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.stop(s+d)}catch(e){}}
const sfx={ok(){beep(660,.1);beep(990,.16,'triangle',.09)},no(){beep(180,.28,'sawtooth')},win(){[523,659,784,1047].forEach((f,i)=>beep(f,.18,'triangle',i*.12))},lose(){[330,262,196].forEach((f,i)=>beep(f,.22,'sawtooth',i*.18))}};
$('#snd').onclick=e=>{S.sound=!S.sound;e.target.textContent=S.sound?'🔊':'🔇'};
function setXp(){const from=S.shown,to=S.xp,t0=performance.now();if(RM||from===to){S.shown=to;$('#xp').textContent=to;return}
 (function f(t){const p=Math.min((t-t0)/600,1);S.shown=Math.round(from+(to-from)*p);$('#xp').textContent=S.shown;if(p<1)requestAnimationFrame(f)})(t0)}
function hud(lost){setXp();$('#hp').innerHTML=app.dataset.play?[0,1,2].map(i=>`<span class="h${i<S.hp?'':' off'}${lost&&i===S.hp?' brk':''}">♥</span>`).join(''):''}
function burst(el){if(RM)return;const r=el.getBoundingClientRect(),x0=r.left+r.width/2,y0=r.top+r.height/2,cs=['#ffd166','#2fe3a0','#ff6bd6','#7c5cff','#35b8ff'];
 for(let i=0;i<26;i++){const s=document.createElement('i'),a=Math.random()*6.28,d=60+Math.random()*130;s.className='cf';
 s.style.cssText=`left:${x0}px;top:${y0}px;background:${cs[i%5]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d+50}px;--r:${Math.random()*720-360}deg`;document.body.appendChild(s);setTimeout(()=>s.remove(),1050)}}
const stars=n=>[0,1,2].map(i=>`<span class="${i<n?'':'e'}" style="--i:${i}">★</span>`).join('');
const col=l=>`--c:${COL[l.id][0]};--c2:${COL[l.id][1]}`;
const unlocked=i=>i<3||[1,2,3].every(k=>S.stars[k]>0);

function map(){
  app.dataset.play='';hud();
  app.innerHTML=`<section class="scr"><h1>Grammar Quest</h1><p class="sub">Повторяем степени сравнения. Пройди 3 уровня, чтобы открыть босса. На каждый уровень даётся 3 жизни.</p>
  <div class="map">${LV.map((l,i)=>`<button class="stage${i==3?' boss':''}" style="${col(l)};--i:${i}" data-i="${i}" ${unlocked(i)?'':'disabled'}>
    <span class="ico">${unlocked(i)?l.icon:'🔒'}</span><span><b>${l.name}</b><small>${l.ru}</small></span>
    <span class="stars">${S.stars[l.id]?'★'.repeat(S.stars[l.id])+'☆'.repeat(3-S.stars[l.id]):''}</span></button>`).join('')}</div></section>`;
  app.querySelectorAll('.stage').forEach(b=>b.onclick=()=>rules(+b.dataset.i));
}
function rules(i){
  S.li=i;const l=LV[i];app.dataset.play='';hud();
  app.innerHTML=`<section class="scr" style="${col(l)}"><div style="margin-bottom:14px"><button class="btn alt" id="back">← Карта</button></div>
  <div class="card glass"><h2>📜 ${l.name}</h2><ul class="rules">${l.rules.map(r=>`<li>${r[0]}<span class="ex">${r[1]}</span></li>`).join('')}</ul></div>
  <div class="center"><button class="btn" id="go">Начать · ${l.qs.length} заданий</button></div></section>`;
  $('#back').onclick=map;$('#go').onclick=()=>{S.hp=3;S.qi=0;S.combo=0;S.got=0;quiz()};
}
function quiz(){
  const l=LV[S.li],q=l.qs[S.qi];app.dataset.play='1';hud();
  app.innerHTML=`<section class="scr" style="${col(l)}"><div class="bar"><i style="width:${S.qi/l.qs.length*100}%"></i></div>
  <div class="card glass" id="card"><div class="meta"><span>${l.name} · ${S.qi+1} из ${l.qs.length}</span>${S.combo>1?`<span class="combo">🔥 комбо ×${S.combo}</span>`:''}</div>
  <p class="q">${q[0].replace('___','<span class="blank" id="bl">&nbsp;?&nbsp;</span>')}</p>${q[1]?`<span class="chip">${q[1]}</span>`:''}
  ${q[3]?`<div class="opts">${q[3].map((o,i)=>`<button class="opt" style="--i:${i}" data-v="${o}">${o}</button>`).join('')}</div>`
  :`<div class="typed"><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Твой ответ" placeholder="введи ответ"><button class="btn" id="chk">Проверить</button></div>`}
  <div id="fb"></div></div></section>`;
  requestAnimationFrame(()=>{const b=$('.bar i');b.style.width=(S.qi+.0001)/l.qs.length*100+'%'});
  if(q[3])app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>check(b.dataset.v,b));
  else{const inp=$('#inp');inp.focus({preventScroll:true});$('#chk').onclick=()=>inp.value.trim()&&check(inp.value,inp);inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim())check(inp.value,inp)}}
}
function check(v,el){
  const l=LV[S.li],q=l.qs[S.qi],norm=s=>s.toLowerCase().replace(/\s+/g,' ').trim(),ok=q[2].includes(norm(v)),card=$('#card');
  app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(q[2].includes(b.dataset.v))b.classList.add('ok')});
  const inp=$('#inp');if(inp){inp.disabled=true;$('#chk').disabled=true}
  el.classList.add(ok?'ok':'no');const bl=$('#bl');bl.textContent=q[2][0];if(ok)bl.classList.add('done');
  let msg;
  if(ok){S.combo++;S.got++;const g=10+Math.min(S.combo-1,4)*5;S.xp+=g;sfx.ok();burst(el);
    card.insertAdjacentHTML('beforeend',`<span class="fl">+${g} XP</span>`);
    msg=`<div class="fb good"><span class="u">Верно!</span>${q[0].replace('___','<b>'+q[2][0]+'</b>')}</div>`;hud()}
  else{S.hp--;S.combo=0;sfx.no();
    msg=`<div class="fb bad"><span class="u">Почти!</span>Правильно: <b>${q[2][0]}</b><br>${q[4]}</div>`;hud(true)}
  const last=S.qi===l.qs.length-1,dead=S.hp<=0;
  $('#fb').innerHTML=msg+`<div class="row"><button class="btn" id="nx">${dead?'Продолжить':last?'Финиш':'Дальше'} →</button></div>`;
  const nx=$('#nx');nx.focus({preventScroll:true});nx.onclick=()=>dead?over():last?win():(S.qi++,quiz());
}
function over(){
  app.dataset.play='';hud();sfx.lose();
  app.innerHTML=`<section class="scr"><div class="card glass center"><div class="skull">💀</div><h2>Game over</h2><p>Жизни закончились. Перечитай правила и попробуй снова. У тебя получится!</p>
  <div class="row"><button class="btn" id="r">Ещё раз</button><button class="btn alt" id="m">Карта</button></div></div></section>`;
  $('#r').onclick=()=>rules(S.li);$('#m').onclick=map;
}
function win(){
  const l=LV[S.li],st=Math.max(1,S.hp);S.stars[l.id]=Math.max(S.stars[l.id]||0,st);S.xp+=20*st;
  app.dataset.play='';hud();sfx.win();
  const all=[1,2,3,4].every(k=>S.stars[k]);
  app.innerHTML=`<section class="scr" style="${col(l)}"><div class="card glass center"><h2>${l.id===4?'Босс повержен!':'Уровень пройден!'}</h2><div class="big">${stars(st)}</div>
  <p>Верных ответов: <b>${S.got}</b> из ${l.qs.length} · бонус +${20*st} XP</p>${all?'<p class="u" style="color:var(--good);font-size:14px">🏆 Все уровни пройдены!</p>':''}
  <div class="row"><button class="btn" id="m">Карта</button>${st<3?'<button class="btn alt" id="r">За 3 звезды</button>':''}</div></div></section>`;
  $('#m').onclick=map;const r=$('#r');if(r)r.onclick=()=>rules(S.li);
  setTimeout(()=>burst($('.big')),500);
}
map();
</script>
</body>
</html>
